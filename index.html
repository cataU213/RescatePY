<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <!-- Permite que la página sea responsive. -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>RescatePY</title>

    <!-- Tipografía moderna. -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS. -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Estilos propios. -->
    <link
        rel="stylesheet"
        href="styles.css">
</head>


<body>

    <!-- =====================================================
         BARRA SUPERIOR
    ====================================================== -->

    <header class="topbar">

    <!-- Menú izquierdo -->
    <div class="menu-ods-contenedor">

        <button
            id="odsMenuBtn"
            class="ods-menu-btn"
            type="button">

            <span class="hamburguesa">☰</span>
            <span>ODS</span>

        </button>

        <div
            id="odsDropdown"
            class="ods-dropdown">

            <button
                id="abrirDonacionBtn"
                type="button">

                <span class="menu-icono">♡</span>
                Quiero donar

            </button>


            <button
                id="abrirDisponiblesBtn"
                type="button">

                <span class="menu-icono">◉</span>
                Alimentos disponibles

            </button>


            <button
                id="abrirAyudarBtn"
                type="button">

                <span class="menu-icono">♥</span>
                Quiero ayudar

            </button>


            <button
                id="abrirAyudaCercaBtn"
                type="button">

                <span class="menu-icono">⌖</span>
                Tu ayuda cerca

            </button>


            <button
                id="abrirManosSumanBtn"
                type="button">

                <span class="menu-icono">✦</span>
                Manos que suman

            </button>


            <button
                id="abrirEcoValorBtn"
                type="button">

                <span class="menu-icono">♻</span>
                EcoValor

            </button>


            <button
                id="abrirOdsImpactoBtn"
                type="button">

                <span class="menu-icono">🌍</span>
                Impacto ODS

            </button>

        </div>

    </div>


    <!-- Acciones derechas -->
    <div class="topbar-acciones">

        <!-- Sesión del usuario -->
        <button id="authButton" class="boton-cuenta" type="button">
            Iniciar sesión
        </button>

        <button id="notificationButton" class="boton-notificacion campo-oculto" type="button">
            🔔 <span id="notificationCount"></span>
        </button>

        <button id="logoutButton" class="boton-salir campo-oculto" type="button">
            Salir
        </button>

        <button
            id="abrirEquipoBtn"
            class="boton-equipo"
            type="button">

            Conocé al equipo

        </button>

        <button
            id="themeToggle"
            class="boton-tema"
            type="button">

            ☾

        </button>

    </div>

</header>



    <!-- =====================================================
         CONTENIDO PRINCIPAL
    ====================================================== -->

    <main class="contenido-principal">


        <!-- =================================================
             IMAGEN PRINCIPAL
        ================================================== -->

        <section class="imagen-principal">

            <!--
                Se fuerza object-fit: contain para que la imagen
                se vea completa y no quede recortada.
            -->
            <img
                src="img/IMA23.png"
                alt="Imagen principal de RescatePY"
                style="
                    width: 100%;
                    height: auto;
                    max-height: 520px;
                    object-fit: contain;
                    object-position: center;
                    display: block;
                    margin: 0 auto;
                    background: #e8ecea;
                ">

        </section>



        <!-- =================================================
             TRES BOTONES PRINCIPALES
        ================================================== -->

        <section class="acciones-principales">


            <!-- RED INSTITUCIONAL -->
            <button
                class="boton-principal"
                data-modal="modalInstitucional"
                type="button">

                Red institucional

            </button>


            <!-- AYUDA TERRITORIAL -->
            <button
                class="boton-principal"
                data-modal="modalTerritorial"
                type="button">

                Ayuda territorial

            </button>


            <!-- INTELIGENCIA SOCIAL -->
            <button
                class="boton-principal"
                data-modal="modalSocial"
                type="button">

                Inteligencia social

            </button>


        </section>

    </main>



    <!-- =====================================================
         MODAL 1 - RED INSTITUCIONAL
    ====================================================== -->

    <div
        id="modalInstitucional"
        class="modal">

        <div class="modal-fondo"></div>


        <section class="modal-contenido">

            <header class="modal-cabecera">

                <h2>
                    Red institucional
                </h2>


                <button
                    class="cerrar-modal"
                    type="button">

                    ×

                </button>

            </header>



    <!-- =====================================================
         JAVASCRIPT
         Debe ir al final de la página.
    ====================================================== -->

    <!-- =====================================================
         LOGIN / REGISTRO - RESCATEPY
    ====================================================== -->

    <div id="authModal" class="donacion-modal-overlay auth-modal-overlay">

        <div id="authBackdrop" class="donacion-modal-fondo"></div>

        <section class="donacion-modal auth-modal">

            <header class="donacion-modal-header">
                <div>
                    <span class="donacion-etiqueta">CUENTA RESCATEPY</span>
                    <h2 id="authTitle">Iniciar sesión</h2>
                </div>

                <button id="closeAuth" class="cerrar-donacion" type="button">×</button>
            </header>

            <div class="donacion-modal-body">

                <div class="auth-tabs">
                    <button id="authTabLogin" class="auth-tab activo" type="button">
                        Ingresar
                    </button>

                    <button id="authTabRegister" class="auth-tab" type="button">
                        Registrarme
                    </button>
                </div>

                <!-- FORMULARIO DE INICIO DE SESIÓN -->
                <form id="loginForm" class="auth-form">

                    <div class="campo-donacion">
                        <label for="loginEmail">Correo electrónico</label>
                        <input
                            id="loginEmail"
                            type="email"
                            required
                            placeholder="correo@ejemplo.com">
                    </div>

                    <div class="campo-donacion">
                        <label for="loginPassword">Contraseña</label>
                        <input
                            id="loginPassword"
                            type="password"
                            required
                            placeholder="Tu contraseña">
                    </div>

                    <!-- Recuperación de contraseña -->
                    <button
                        id="forgotPasswordBtn"
                        type="button"
                        style="display:block;margin:10px 0 14px auto;background:transparent;border:0;color:#159a52;cursor:pointer;font:inherit;text-decoration:underline;">

                        ¿Olvidaste tu contraseña?

                    </button>

                    <button class="ejecutar-validacion" type="submit">
                        Iniciar sesión
                    </button>

                </form>

                <!-- FORMULARIO DE REGISTRO -->
                <form id="registerForm" class="auth-form campo-oculto">

                    <div class="campo-donacion">
                        <label for="registerName">Nombre</label>
                        <input
                            id="registerName"
                            type="text"
                            required
                            placeholder="Tu nombre u organización">
                    </div>

                    <div class="campo-donacion">
                        <label for="registerEmail">Correo electrónico</label>
                        <input
                            id="registerEmail"
                            type="email"
                            required
                            placeholder="correo@ejemplo.com">
                    </div>

                    <div class="campo-donacion">
                        <label for="registerPassword">Contraseña</label>
                        <input
                            id="registerPassword"
                            type="password"
                            minlength="6"
                            required
                            placeholder="Mínimo 6 caracteres">
                    </div>

                    <div class="campo-donacion">
                        <label for="registerPassword2">Repetir contraseña</label>
                        <input
                            id="registerPassword2"
                            type="password"
                            minlength="6"
                            required
                            placeholder="Repetí la contraseña">
                    </div>

                    <button class="ejecutar-validacion" type="submit">
                        Crear cuenta
                    </button>

                </form>

                <!-- Mensajes de autenticación -->
                <p id="authMessage" class="auth-message"></p>

            </div>

        </section>

    </div>


    <!-- =====================================================
         NOTIFICACIONES
    ====================================================== -->

    <div id="notificationModal" class="donacion-modal-overlay">

        <div id="notificationBackdrop" class="donacion-modal-fondo"></div>

        <section class="donacion-modal auth-modal">

            <header class="donacion-modal-header">
                <div>
                    <span class="donacion-etiqueta">SOLICITUDES</span>
                    <h2>Notificaciones</h2>
                </div>

                <button
                    id="closeNotifications"
                    class="cerrar-donacion"
                    type="button">
                    ×
                </button>
            </header>

            <div class="donacion-modal-body">
                <div
                    id="notificationList"
                    class="notificacion-lista">
                </div>
            </div>

        </section>

    </div>


    <!-- =====================================================
         CARGA DE JAVASCRIPT
    ====================================================== -->

    <script src="auth-client.js"></script>
    <script src="app.js"></script>

</body>

</html>
